name: Unit-Tests

on:
  pull_request:

jobs:
  unit_tests:

    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      DANGER_GITHUB_API_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 100

    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically

    - name: Build App
      run: bundle exec fastlane unit_tests_build_for_testing

    - name: Check warnings count
      run: bundle exec danger --dangerfile=DangerWarningsCount --danger_id=WarningsCount --fail-on-errors=true

    - name: Run Unit-Tests
      run: bundle exec fastlane unit_tests_run_without_building
